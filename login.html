<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Law ERP by AXION TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="wrap">

  <!-- LEFT — signature panel -->
  <section class="stage" aria-hidden="false">
    <div class="dots" id="dots"></div>

    <div class="scale-wrap">
      <svg class="scale" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="110" y1="18" x2="110" y2="176" stroke="currentColor" stroke-width="1.4"/>
        <line x1="40" y1="52" x2="180" y2="52" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="110" cy="18" r="4" fill="currentColor"/>
        <path d="M40 52 L20 96 Q40 110 60 96 Z" stroke="currentColor" stroke-width="1.2"/>
        <line x1="40" y1="52" x2="20" y2="96" stroke="currentColor" stroke-width="1" opacity=".55"/>
        <line x1="40" y1="52" x2="60" y2="96" stroke="currentColor" stroke-width="1" opacity=".55"/>
        <path d="M180 52 L160 96 Q180 110 200 96 Z" stroke="currentColor" stroke-width="1.2"/>
        <line x1="180" y1="52" x2="160" y2="96" stroke="currentColor" stroke-width="1" opacity=".55"/>
        <line x1="180" y1="52" x2="200" y2="96" stroke="currentColor" stroke-width="1" opacity=".55"/>
        <path d="M78 176 L142 176 L132 194 L88 194 Z" stroke="currentColor" stroke-width="1.4"/>
        <line x1="70" y1="200" x2="150" y2="200" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </div>

    <div class="stage-copy">
      <p class="eyebrow">AXION TECH · SISTEMA JURÍDICO</p>
      <h1>Equilíbrio<br>em cada<br><em>processo.</em></h1>
      <p class="stage-sub">Clientes, prazos, agenda e financeiro do seu escritório, organizados em um único lugar.</p>
    </div>
  </section>

  <!-- RIGHT — credentials -->
  <section class="panel">
    <div class="panel-inner">

      <div class="brand">
        <span class="brand-mark">⚖</span>
        <div class="brand-text">
          <span>Law ERP</span>
          <small>ERP JURÍDICO</small>
        </div>
      </div>

      <form class="form" id="loginForm" novalidate>
        <p class="form-eyebrow">Acesso ao sistema</p>

        <label class="field">
          <span class="field-label">E-mail<sup>*</sup></span>
          <input type="email" name="email" id="email" autocomplete="username" placeholder="nome@escritorio.com.br" required>
        </label>

        <label class="field">
          <span class="field-label">Senha<sup>*</sup></span>
          <div class="pass-wrap">
            <input type="password" name="senha" id="senha" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="eye" id="eyeToggle" aria-label="Mostrar senha" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </label>

        <button type="submit" class="btn-enter" id="btnEnter">Entrar</button>

        <a href="#" class="forgot">Esqueci minha senha.</a>
      </form>

      <div class="support">
        <p>Precisa de ajuda para acessar? Fale com o suporte.</p>
        <a href="mailto:suporte@axiontech.com.br">suporte@axiontech.com.br</a>
      </div>

    </div>
  </section>

</div>

<script src="login.js"></script>
</body>
</html>
